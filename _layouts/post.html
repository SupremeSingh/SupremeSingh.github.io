---
layout: default
---
<article>
  <header class="post-header">
    <h1>{{ page.title | escape }}</h1>
    <time class="muted" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>
  </header>
  <div class="post-content">{{ content }}</div>
</article>
<p class="back-link"><a href="{{ '/posts/' | relative_url }}">All posts</a></p>
